<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Yinnotayl — Home</title>
<link rel="icon" type="image/png" href="yinnotayl.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #fff;
    --text: #222;
    --muted: #6b6b6b;
    --accent: #6a0dad;
    --magnet-web: #6a0dad;
    --magnet-repo: #2a2a2a;
    --font: "Google Sans Flex", "Google Sans", "Product Sans", Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #16131a; --text: #ece8f1; --muted: #9b94a5;
        --accent: #b57be6; --magnet-repo: #3b3544;
    }
}
* { box-sizing: border-box; }
body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); line-height: 1.7; -webkit-font-smoothing: antialiased;
}

/* ---------- top canvas: things stuck to the wall ---------- */
body { overflow-x: clip; }
#stage { position: relative; height: 100vh; height: 100svh; min-height: 560px; }
.group { display: contents; }

.label, .magnet, .tung { position: absolute; left: var(--x); top: var(--y); }
.label { margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--accent); }

.magnet, .tung {
    display: inline-block; z-index: 2;
    padding: 9px 16px; border-radius: 3px; border: 0;
    font: inherit; font-size: .95rem; font-weight: 500; line-height: 1.4;
    color: #fff; text-decoration: none; white-space: nowrap;
    box-shadow: 2px 3px 0 rgba(0, 0, 0, .2);
}
.magnet { transform: rotate(var(--r)); }
.magnet.web { background: var(--magnet-web); }
.magnet.repo { background: var(--magnet-repo); }
.magnet:hover { text-decoration: underline; text-underline-offset: 3px; }
.tung {
    background: #111; cursor: pointer; z-index: 4;
    transform: translate(var(--tx, 0px), var(--ty, 0px));
    transition: transform .10s cubic-bezier(.2, .8, .2, 1), background .15s;
}
.tung.fast { transition-duration: .07s, .15s; }
.tung.dodging { transition-duration: .035s, .15s; }
.tung:hover { background: var(--accent); }
.magnet:focus-visible, .tung:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

@keyframes spin {
    from { transform: rotate(var(--r)); }
    to   { transform: rotate(calc(var(--r) + 360deg)); }
}
#stage.spinning .magnet { animation: spin .2s linear infinite; }
@media (prefers-reduced-motion: reduce) {
    #stage.spinning .magnet { animation: none; }
}

/* soft glow with text on top, fading into blank */
#glow {
    position: absolute; right: 0; bottom: 0; z-index: 1; pointer-events: none;
    width: min(760px, 100%); height: 440px;
    background: radial-gradient(ellipse 75% 80% at 100% 100%,
        rgba(106, 13, 173, .95) 0%, rgba(140, 40, 200, .6) 32%, rgba(166, 77, 224, .22) 58%, rgba(166, 77, 224, 0) 80%);
}
#hello {
    position: absolute; right: 28px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 3;
    margin: 0; color: #fff; font-size: 1.7rem; font-weight: 600; line-height: 1.2;
    text-align: right; pointer-events: none;
}

/* ---------- below the fold ---------- */
.section { max-width: 560px; margin: 0 auto; padding: 18vh 24px; }
.section h2 { margin: 0 0 28px; font-size: 1.05rem; font-weight: 600; color: var(--accent); }

.birb { text-align: center; padding-bottom: 6vh; }
.birb h2 { text-align: left; }
.birb img { display: block; max-width: 100%; height: auto; margin: 0 auto 14px; border-radius: 10px; }
.birb .caption { min-height: 1.7em; margin: 0; color: var(--muted); font-size: .95rem; }
.birb .actions { margin-top: 18px; display: flex; gap: 22px; justify-content: center; }
.birb button { font: inherit; font-size: .95rem; color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.birb button:hover { text-decoration: underline; text-underline-offset: 4px; }
.birb button:disabled { opacity: .5; cursor: default; text-decoration: none; }
.birb button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.poem .line { margin: 0; }
.poem .gap { height: 1.8em; }
.poem .word {
    display: inline-block; margin-right: .28em; opacity: 0; transform: translateY(18px);
    transition: opacity 700ms cubic-bezier(.16, .9, .3, 1), transform 700ms cubic-bezier(.16, .9, .3, 1);
}
.poem .word.visible { opacity: 1; transform: none; }
.poem .by { margin-top: 3em; color: var(--muted); font-size: .95rem; }
@media (prefers-reduced-motion: reduce) { .poem .word { opacity: 1; transform: none; transition: none; } }

/* phones: same scattered feel, but flowing so nothing runs off the edge */
@media (max-width: 620px) {
    #stage { height: auto; min-height: 100svh; padding: 40px 20px 300px; }
    .group { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 12px; margin-bottom: 44px; }
    .label { position: static; flex-basis: 100%; }
    .magnet, .tung { position: static; }
    .magnet { margin-left: var(--ml, 0); }
    #hello { font-size: 1.35rem; right: 20px; }
    #glow { height: 340px; }
}
</style>
</head>
<body>

<section id="stage" aria-label="Links">
    <div class="group" id="webs"></div>
    <div class="group" id="repos"></div>
    <div id="glow" aria-hidden="true"></div>
    <h1 id="hello">Hewwo, I’m Yinnotayl</h1>
</section>

<section class="section birb" aria-live="polite">
    <h2>Random birb</h2>
    <img id="birbImg" alt="Random birb" src="noBird.png">
    <p id="birbCaption" class="caption"></p>
    <div class="actions">
        <button id="newBirb" type="button">Another birb</button>
        <button id="shuffleBird" type="button"></button>
    </div>
</section>

<section class="section poem" aria-labelledby="poem-heading">
    <h2 id="poem-heading">A poem I wrote</h2>
    <div id="poem"></div>
</section>

<script>
/* ================= magnets =================
   [label, link, x% , y% , rotation(deg), phone left-offset(px)]
   Tweak these numbers to move things around. */
const WEBSITES = [
    ['intense shooter',         'https://yinnotayl.github.io/intenseShooter',                  6, 17, -3,  0],
    ['tetris',                  'https://yinnotayl.github.io/tetris',                         58, 15,  2, 30],
    ['polytrack modded',        'https://yinnotayl.github.io/Polytrack',                      27, 27,  4, 14],
    ['rngdle utilities',        'https://rngdle-utils.vercel.app',                            50, 31, -2,  0],
    ['hunt the wumpus',         'https://yinnotayl.github.io/Hunt-The-Wumpus-Game-Remake-',   66, 41,  3, 40]
];
const REPOS = [
    ['nn for mnist',            'https://github.com/Yinnotayl/MNIST-NN',                       6, 61,  2, 10],
    ['(my attempt) at ios26',   'https://github.com/Yinnotayl/Liquid-Glass-Effect-iOS26',     36, 66, -4,  0],
    ['spaceui✨✨',              'https://github.com/Yinnotayl/SpaceUI',                       14, 76,  3, 24]
];

const stage = document.getElementById('stage');

function put(el, x, y, r, ml) {
    el.style.setProperty('--x', x + '%');
    el.style.setProperty('--y', y + '%');
    if (r !== undefined) el.style.setProperty('--r', r + 'deg');
    if (ml !== undefined) el.style.setProperty('--ml', ml + 'px');
}

function fill(groupId, title, titleXY, items, cls, extra) {
    const g = document.getElementById(groupId);
    const h = document.createElement('h2');
    h.className = 'label'; h.textContent = title;
    put(h, titleXY[0], titleXY[1]);
    g.appendChild(h);
    if (extra) g.appendChild(extra);
    items.forEach(([label, href, x, y, r, ml]) => {
        const a = document.createElement('a');
        a.className = 'magnet ' + cls; a.textContent = label;
        a.href = href; a.target = '_blank'; a.rel = 'noopener';
        put(a, x, y, r, ml);
        g.appendChild(a);
    });
}

/* the "tung" button: hover spins every magnet on desktop, tap toggles the spin on touch */
const tung = document.createElement('button');
tung.type = 'button'; tung.className = 'tung'; tung.textContent = 'tung';
tung.setAttribute('aria-pressed', 'false');
put(tung, 22, 49.5);

/* ---- tung easter eggs (mouse only; touch/keyboard toggle spin) ----
   1: move right 70px; 2–4: cumulative hover budgets of .3s, 1s, 3s;
   4: then jump every .2s for 2s; 5: dodge ten distinct hover entries;
   6: spin only while hovered, until a click resets the sequence. */
const HOVER_BUDGET = { 2: 300, 3: 1000, 4: 3000 };
let step = 1, busy = false, hovered = false, pendingHover = false;
let hoverElapsed = 0, hoverStarted = null, hoverTimer = null;
let dodgeCount = 0, target = null;
const mouse = { x: -999, y: -999 };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const spin = on => {
    stage.classList.toggle('spinning', on);
    tung.setAttribute('aria-pressed', String(on));
};
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

function currentPos() {
    const r = tung.getBoundingClientRect();
    return { x: r.left + scrollX, y: r.top + scrollY };
}
function homePos() {
    const p = currentPos();
    const t = getComputedStyle(tung).transform;
    const m = t === 'none' ? new DOMMatrix() : new DOMMatrix(t);
    return { x: p.x - m.m41, y: p.y - m.m42 };
}
function pageRegion() {
    // Full document, not the visible viewport. The body's normal-flow
    // height excludes overflow caused by the moving button itself.
    const root = document.documentElement;
    const bottom = Math.max(root.clientHeight,
        document.body.getBoundingClientRect().bottom + scrollY);
    const maxX = Math.max(0, root.clientWidth - tung.offsetWidth);
    const maxY = Math.max(0, bottom - tung.offsetHeight);
    const mx = Math.min(10, maxX / 2), my = Math.min(10, maxY / 2);
    return { x0: mx, x1: maxX - mx, y0: my, y1: maxY - my };
}
function heroRegion() {
    const p = pageRegion(), r = stage.getBoundingClientRect();
    const left = r.left + scrollX, top = r.top + scrollY;
    const x0 = Math.max(p.x0, left + 10), y0 = Math.max(p.y0, top + 10);
    const x1 = Math.min(p.x1, left + r.width - tung.offsetWidth - 10);
    const y1 = Math.min(p.y1, top + r.height - tung.offsetHeight - 10);
    return { x0, x1: Math.max(x0, x1), y0, y1: Math.max(y0, y1) };
}
function bounded(x, y, reg = pageRegion()) {
    return { x: clamp(x, reg.x0, reg.x1), y: clamp(y, reg.y0, reg.y1) };
}
function goTo(x, y, reg = pageRegion()) {
    const h = homePos();
    target = bounded(x, y, reg);
    tung.style.setProperty('--tx', (target.x - h.x) + 'px');
    tung.style.setProperty('--ty', (target.y - h.y) + 'px');
}
function goHome() {
    const h = homePos(), p = bounded(h.x, h.y);
    tung.style.setProperty('--tx', (p.x - h.x) + 'px');
    tung.style.setProperty('--ty', (p.y - h.y) + 'px');
    target = null;
}
function nearMouse(p, pad = 12) {
    const x = mouse.x + scrollX, y = mouse.y + scrollY;
    return x >= p.x - pad && x <= p.x + tung.offsetWidth + pad &&
           y >= p.y - pad && y <= p.y + tung.offsetHeight + pad;
}
function randomSpot(reg) {
    let p;
    for (let i = 0; i < 30; i++) {
        p = { x: reg.x0 + Math.random() * (reg.x1 - reg.x0),
              y: reg.y0 + Math.random() * (reg.y1 - reg.y0) };
        if (!nearMouse(p, 20)) break;
    }
    return p;
}
function jump(reg) {
    const p = randomSpot(reg);
    goTo(p.x, p.y, reg);
}
function dodge() {
    const p = currentPos(), reg = pageRegion();
    const cx = mouse.x + scrollX, cy = mouse.y + scrollY;
    const w = tung.offsetWidth, h = tung.offsetHeight;
    const angle = Math.atan2(p.y + h / 2 - cy, p.x + w / 2 - cx);
    // Try small moves away from the cursor, then sideways near a page edge.
    // Larger moves are only a fallback if the smaller ones cannot escape.
    for (const distance of [80, 110, 150, 200]) {
        let best = null, score = -Infinity;
        for (let i = 0; i < 16; i++) {
            const a = angle + i * Math.PI / 8;
            const q = bounded(p.x + Math.cos(a) * distance,
                              p.y + Math.sin(a) * distance, reg);
            if (nearMouse(q, 22)) continue;
            const s = Math.hypot(q.x + w / 2 - cx, q.y + h / 2 - cy);
            if (s > score) { best = q; score = s; }
        }
        if (best) { goTo(best.x, best.y, reg); return true; }
    }
}

function rememberMouse(e) { mouse.x = e.clientX; mouse.y = e.clientY; }

function unlock(nextStep) {
    step = nextStep;
    busy = false;
    const reentered = pendingHover && hovered;
    pendingHover = false;
    // A new entry during a movement is not lost if the pointer is still on it.
    if (reentered) onHover();
    else if (step === 6 && hovered) spin(true);
}

function pauseTimedSpin() {
    clearTimeout(hoverTimer);
    hoverTimer = null;
    if (hoverStarted !== null) {
        hoverElapsed += performance.now() - hoverStarted;
        hoverStarted = null;
    }
    spin(false);
}
function checkHoverBudget() {
    if (busy || !hovered || hoverStarted === null) return;
    const remaining = HOVER_BUDGET[step] - hoverElapsed -
        (performance.now() - hoverStarted);
    if (remaining > 0) {
        hoverTimer = setTimeout(checkHoverBudget, remaining);
        return;
    }
    pauseTimedSpin();
    finishTimedStage();
}
function resumeTimedSpin() {
    if (hoverStarted !== null || document.hidden) return;
    hoverStarted = performance.now();
    spin(true);
    checkHoverBudget();
}
async function finishTimedStage() {
    if (busy) return;
    busy = true;
    const completed = step;
    hoverElapsed = 0;
    if (completed === 2) {
        jump(heroRegion());
        await sleep(105);
    } else if (completed === 3) {
        jump(pageRegion());
        await sleep(105);
    } else {
        tung.classList.add('fast');
        const start = performance.now();
        for (let i = 0; i < 10; i++) {
            jump(pageRegion());
            await sleep(Math.max(0, start + (i + 1) * 200 - performance.now()));
        }
        tung.classList.remove('fast');
    }
    unlock(completed + 1);
}
async function onHover() {
    if (busy) { pendingHover = true; return; }
    if (step === 1) {
        busy = true;
        const p = currentPos();
        goTo(p.x + 70, p.y);
        await sleep(105);
        unlock(2);
    } else if (HOVER_BUDGET[step]) {
        resumeTimedSpin();
    } else if (step === 5) {
        // Exactly one dodge for each pointer entry, not for pointermove events.
        tung.classList.add('dodging');
        dodge();
        dodgeCount++;
        if (dodgeCount === 10) {
            busy = true;
            await sleep(40); // let the tenth dodge visibly finish
            tung.classList.remove('dodging');
            goHome();
            await sleep(105);
            unlock(6);
        }
    } else {
        spin(true);
    }
}

tung.addEventListener('pointerenter', e => {
    if (e.pointerType !== 'mouse') return;
    rememberMouse(e);
    hovered = true;
    onHover();
});
tung.addEventListener('pointerleave', e => {
    if (e.pointerType !== 'mouse') return;
    hovered = false;
    pendingHover = false;
    if (hoverStarted !== null) {
        pauseTimedSpin();
        if (hoverElapsed >= HOVER_BUDGET[step]) finishTimedStage();
    } else if (step === 6) spin(false);
});
addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') rememberMouse(e);
});
// A hidden tab does not consume the hover budget.
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (hoverStarted !== null) {
            pauseTimedSpin();
            if (hoverElapsed >= HOVER_BUDGET[step]) finishTimedStage();
        } else if (step === 6) spin(false);
    } else if (!busy && hovered && tung.matches(':hover')) {
        if (HOVER_BUDGET[step]) resumeTimedSpin();
        else if (step === 6) spin(true);
    }
});

// If the bird image or browser size changes, keep the destination on-page.
function keepInBounds() {
    if (target) {
        const p = bounded(target.x, target.y);
        goTo(p.x, p.y);
    } else goHome();
}
addEventListener('resize', keepInBounds);
const tungBoundsObserver = new ResizeObserver(keepInBounds);
tungBoundsObserver.observe(document.body);
tungBoundsObserver.observe(stage);
tungBoundsObserver.observe(tung);

tung.addEventListener('click', e => {
    if (step === 6 && !busy) {
        step = 1;
        dodgeCount = 0;
        hoverElapsed = 0;
        pendingHover = false;
        pauseTimedSpin();
        goHome();
        return;
    }
    if (busy || hoverStarted !== null) return;
    const isMouse = e.pointerType === 'mouse' ||
        (!e.pointerType && e.detail !== 0 && matchMedia('(hover: hover)').matches);
    if (isMouse && e.detail !== 0) return;
    spin(!stage.classList.contains('spinning'));
});

fill('webs', 'Random websites I made', [6, 7], WEBSITES, 'web');
fill('repos', 'Repos', [6, 50.5], REPOS, 'repo', tung);

/* ================= poem with fade ================= */
const POEM = `There will come soft rains,
falling through the veil of night,
gentle as breath no longer drawn,
washing away the weight of dawn.

There will come soft rains,
over fields where we once lay,
where time dissolves, and names are still,
and every wound forgets its will.

Till that day
when the rain stops falling,
when the snow starts melting,
when the sun stops shining.

Till we leave for the place
where the sun always shines,
where the leaves never fall,
where hope blooms bright in endless time.

No clocks, no cries, just open skies,
a hush that hums where spirit flies.
Beyond the dark, a quiet new,
do you feel it?
I do`;

(function buildPoem() {
    const box = document.getElementById('poem');
    const lines = [];
    POEM.split('\n').forEach(text => {
        if (!text.trim()) { const g = document.createElement('div'); g.className = 'gap'; box.appendChild(g); return; }
        const p = document.createElement('p');
        p.className = 'line';
        text.split(' ').forEach(w => {
            const s = document.createElement('span');
            s.className = 'word'; s.textContent = w;
            p.appendChild(s); p.appendChild(document.createTextNode(' '));
        });
        box.appendChild(p);
        lines.push(p);
    });
    const by = document.createElement('p');
    by.className = 'by'; by.textContent = 'by Yinnotayl';
    box.appendChild(by);

    const io = new IntersectionObserver(entries => {
        entries.forEach(({ target, isIntersecting }) => {
            target.querySelectorAll('.word').forEach((w, i) => {
                w.style.transitionDelay = isIntersecting ? `${i * 40}ms` : '0ms';
                w.classList.toggle('visible', isIntersecting);
            });
        });
    }, { rootMargin: '0px 0px -18% 0px', threshold: 0.05 });
    lines.forEach(l => io.observe(l));
})();

/* ================= birb ================= */
const API_KEY = '60cf5b6c-b268-4dbd-924f-4443d4d38cc5'; // consider moving to a server later
const PLACEHOLDER = 'https://images3.memedroid.com/images/UPLOADED32/6020b8ee6ffaa.jpeg';
const FAMILIES = [
    'Accipitridae', 'Alcidae', 'Alcedinidae', 'Alaudidae', 'Anatidae', 'Apodidae', 'Aramidae', 'Ardeidae',
    'Caprimulgidae', 'Cathartidae', 'Ciconiidae', 'Columbidae', 'Corvidae', 'Cracidae', 'Cuculidae',
    'Falconidae', 'Fregatidae', 'Fringillidae', 'Gruidae', 'Haematopodidae', 'Hirundinidae', 'Icteridae',
    'Laridae', 'Laniidae', 'Odontophoridae', 'Phasianidae', 'Podicipedidae', 'Rallidae', 'Recurvirostridae',
    'Scolopacidae', 'Stercorariidae', 'Trochilidae'
];
let cachedBirds = null, lastImgUrl = null, familyIndex = 0;
const birbImg = document.getElementById('birbImg');
const birbCap = document.getElementById('birbCaption');
const newBtn = document.getElementById('newBirb');
const shuffleBtn = document.getElementById('shuffleBird');

const imgUrl = i => !i ? null : typeof i === 'string' ? i : (i.url || i.src || i.full || i.thumb || null);

async function fetchBirds(family) {
    if (cachedBirds) return cachedBirds;
    const res = await fetch(`https://nuthatch.lastelm.software/v2/birds?family=${encodeURIComponent(family)}&hasImg=true`,
        { headers: { 'api-key': API_KEY } });
    if (!res.ok) throw new Error('Network response was not OK: ' + res.status);
    const json = await res.json();
    const raw = Array.isArray(json) ? json : (Array.isArray(json.entities) ? json.entities : []);
    cachedBirds = raw
        .map(b => ({ ...b, images: Array.isArray(b.images) ? b.images.map(imgUrl).filter(Boolean) : [] }))
        .filter(b => b.images.length);
    return cachedBirds;
}

function pickRandom(birds) {
    if (!birds.length) return null;
    const bird = birds[Math.floor(Math.random() * birds.length)];
    return { bird, url: bird.images[Math.floor(Math.random() * bird.images.length)] };
}

async function showRandomBirb() {
    newBtn.disabled = true;
    birbImg.src = PLACEHOLDER; birbCap.textContent = 'Loading…';
    try {
        const birds = await fetchBirds(FAMILIES[familyIndex]);
        let c = null;
        for (let i = 0; i < 8; i++) { const t = pickRandom(birds); if (t && t.url !== lastImgUrl) { c = t; break; } }
        c = c || pickRandom(birds);
        if (!c) { birbCap.textContent = 'No birb images found :('; return; }
        lastImgUrl = c.url; birbImg.src = c.url;
        birbImg.alt = `${c.bird.name || 'Unknown'} (${c.bird.sciName || ''})`;
        birbCap.textContent = `${c.bird.name || 'Unknown'} — ${c.bird.sciName || ''}`;
    } catch (err) {
        console.error(err); birbCap.textContent = 'Error loading birbs.';
    } finally { newBtn.disabled = false; }
}

newBtn.addEventListener('click', showRandomBirb);
shuffleBtn.addEventListener('click', () => {
    familyIndex = (familyIndex + 1) % FAMILIES.length;
    cachedBirds = null;
    shuffleBtn.textContent = `Source: ${FAMILIES[familyIndex]}`;
    showRandomBirb();
});
shuffleBtn.textContent = `Source: ${FAMILIES[familyIndex]}`;
showRandomBirb();
</script>
</body>
</html>
